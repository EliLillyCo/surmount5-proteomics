name: Reproducibility checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-reproducibility:
    name: Validate reproducibility surface
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0

      - name: Install locked pixi environment
        run: pixi install --locked

      - name: Sync locked uv-managed Python dependencies
        run: pixi run sync

      - name: Verify pinned R packages
        run: pixi run check-r

      - name: Run fast reproducibility checks
        run: pixi run validate
